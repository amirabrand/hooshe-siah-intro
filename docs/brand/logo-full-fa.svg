<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <!-- هوش سیاه — full logo with Persian wordmark -->
  <defs>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="textgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ececf4"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Mark -->
  <circle cx="150" cy="170" r="110" fill="url(#corona)" opacity="0.8"/>
  <circle cx="150" cy="170" r="84" fill="none" stroke="url(#rim)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="150" cy="170" r="72" fill="#050508"/>
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="130" x2="150" y2="155"/>
    <line x1="124" y1="190" x2="141" y2="177"/>
    <line x1="176" y1="190" x2="159" y2="177"/>
    <line x1="150" y1="155" x2="141" y2="177"/>
    <line x1="150" y1="155" x2="159" y2="177"/>
    <line x1="150" y1="182" x2="150" y2="212"/>
  </g>
  <g fill="#e9d5ff">
    <circle cx="150" cy="130" r="10"/>
    <circle cx="150" cy="155" r="12"/>
    <circle cx="124" cy="190" r="8"/>
    <circle cx="176" cy="190" r="8"/>
    <circle cx="150" cy="212" r="7"/>
  </g>

  <!-- Persian wordmark: هوش سیاه -->
  <text x="300" y="215" font-family="Vazirmatn, Tahoma, sans-serif" font-size="150" font-weight="900" fill="url(#textgrad)" direction="rtl">هوش سیاه</text>
  <!-- Latin subtitle -->
  <text x="305" y="278" font-family="system-ui, sans-serif" font-size="34" font-weight="600" fill="#8b8ba3" letter-spacing="10">HOOSHE SIAH</text>
</svg>
